name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/audit_bundle.py --tracked
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/build_all.py
      - run: python scripts/check_all.py
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: crash-game-kit
          path: |
            deliverables/Crash-Classroom.html
            deliverables/Crash-Classroom.pptx
            dist/Crash-Game-Kit.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: crash-game-kit
          path: assets
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$REPOSITORY" --verify-tag \
            --title "Crash Game Kit $TAG" --generate-notes \
            assets/deliverables/Crash-Classroom.html \
            assets/deliverables/Crash-Classroom.pptx \
            assets/dist/Crash-Game-Kit.zip \
            assets/dist/SHA256SUMS.txt
