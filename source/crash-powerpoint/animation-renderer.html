<!doctype html><meta charset="utf-8"><style>html,body{margin:0;overflow:hidden;background:#050829}canvas{display:block}</style><script type="module">
import * as THREE from './assets/three.module.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1280,720);renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.appendChild(renderer.domElement);
const loader=new THREE.TextureLoader();const [crateMap,crashMap]=await Promise.all(['crate-face.png','crash.png'].map(n=>loader.loadAsync('./assets/'+n)));crateMap.colorSpace=crashMap.colorSpace=THREE.SRGBColorSpace;
const intro=new THREE.Scene();intro.background=new THREE.Color('#faf9f4');intro.fog=new THREE.Fog('#faf9f4',18,50);intro.add(new THREE.HemisphereLight('#ffffff','#a9a5aa',3));const sun=new THREE.DirectionalLight('#fff0d0',4);sun.position.set(-6,10,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-15;sun.shadow.camera.right=15;sun.shadow.camera.top=12;sun.shadow.camera.bottom=-12;intro.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#f5f2e9',roughness:.85}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.4;floor.receiveShadow=true;intro.add(floor);
const cam=new THREE.PerspectiveCamera(40,16/9,.1,100);cam.position.set(0,2,16);cam.lookAt(0,0,0);
const cubes=[];for(let i=0;i<7;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.6,1.6),new THREE.MeshStandardMaterial({map:crateMap,roughness:.63}));m.castShadow=true;m.receiveShadow=true;intro.add(m);cubes.push(m);}
const character=new THREE.Mesh(new THREE.PlaneGeometry(5.5,5.5*crashMap.image.height/crashMap.image.width),new THREE.MeshBasicMaterial({map:crashMap,transparent:true,alphaTest:.08,side:THREE.DoubleSide}));intro.add(character);
const portal=new THREE.Scene();portal.background=new THREE.Color('#070c24');portal.fog=new THREE.FogExp2('#05102c',.026);const pcam=new THREE.PerspectiveCamera(64,16/9,.1,150);pcam.position.z=10;
portal.add(new THREE.AmbientLight('#6b77ff',2));const light=new THREE.PointLight('#48f5ff',250);light.position.set(0,0,4);portal.add(light);
const rings=[];for(let i=0;i<18;i++){const torus=new THREE.Mesh(new THREE.TorusGeometry(3.2,.065,10,96),new THREE.MeshBasicMaterial({color:i%2?'#278aca':'#9e69ed'}));torus.position.z=-i*4;torus.rotation.z=i*.5;portal.add(torus);rings.push(torus);}
const gate=new THREE.Group();portal.add(gate);for(let i=0;i<18;i++){const angle=i/18*Math.PI*2;const stone=new THREE.Mesh(new THREE.BoxGeometry(.85,1.2,.75),new THREE.MeshStandardMaterial({color:i%2?'#315066':'#566971',roughness:.8,metalness:.12}));stone.position.set(Math.sin(angle)*3.9,Math.cos(angle)*3.9,0);stone.rotation.z=-angle;gate.add(stone);}
const vortex=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.ShaderMaterial({uniforms:{time:{value:0}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'precision highp float; varying vec2 vUv;uniform float time;void main(){vec2 p=vUv-.5;float r=length(p);float a=atan(p.y,p.x);float spiral=pow(max(0.,sin(a*6.+r*90.-time*4.)),5.);float core=exp(-r*18.);vec3 col=mix(vec3(.015,.06,.22),vec3(.05,.4,.72),spiral*.8)+vec3(.15,.8,1.)*core;gl_FragColor=vec4(col,1.);}'}));vortex.position.z=-76;portal.add(vortex);
const positions=new Float32Array(1800);for(let i=0;i<600;i++){positions[3*i]=Math.sin(i*12.9898)*12;positions[3*i+1]=Math.cos(i*7.234)*9;positions[3*i+2]=-(i%80);}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(positions,3));const stars=new THREE.Points(geo,new THREE.PointsMaterial({color:'#a7f8ff',size:.06,transparent:true,opacity:.9}));portal.add(stars);
window.renderFrame=(mode,t)=>{if(mode==='intro'){const burst=Math.max(0,t-1.1),ease=Math.min(1,t/1.1);cubes.forEach((c,i)=>{const angle=i/7*Math.PI*2;const radius=2.6+burst*1.3;c.position.set(Math.cos(angle)*radius,Math.max(-1.5,Math.sin(angle)*1.5+burst*.7),Math.sin(angle)*1.8-2);c.rotation.set(t*(.2+i*.08),t*(.6+i*.1),burst*(i%2?-.5:.5));c.scale.setScalar(Math.max(.7,1-burst*.05));});character.position.set(.15*Math.sin(t*2),-.3+Math.sin(ease*Math.PI)*1.2,2);character.rotation.z=Math.sin(t*2)*.065;character.scale.setScalar(.05+.95*Math.min(1,t/.9));cam.position.z=16-t*.25;renderer.render(intro,cam);}else{pcam.position.z=10-t*14;pcam.rotation.z=Math.sin(t*.5)*.08;gate.rotation.z=t*.11;vortex.material.uniforms.time.value=t;stars.rotation.z=-t*.06;rings.forEach((r,i)=>r.rotation.z=t*.12+i*.5);renderer.render(portal,pcam);}};window.ready=true;window.renderFrame('intro',0);
</script>
